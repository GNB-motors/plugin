name: Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    # Pinned: ubuntu-latest is migrating to Ubuntu 26 (from 19 Oct 2026) and
    # `playwright install --with-deps chromium` fails there (31 Oct, twice, at
    # the install step, before the build). Move back once Playwright supports it.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-extension

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      - name: Run Playwright smoke test
        run: xvfb-run --auto-servernum -- npm run test:smoke

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: extension/test-results/
